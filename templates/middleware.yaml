{{- if .Values.middleware.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Chart.Name }}-verify
  namespace: {{ .Release.Namespace }}
spec:
  forwardAuth:
    address: http://{{ .Chart.Name }}.{{ .Release.Namespace }}.svc.cluster.local/verify
    trustForwardHeader: true
    authResponseHeaders:
    - X-User-Id
    - X-Username
    - X-Email
{{- end }}
