replicaCount: 1

image:
  registry: ghcr.io/milanpanic2
  name: auth
  tag: main
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  host: auth.homelab.com
  annotations:
    cert-manager.io/cluster-issuer: homelab-ca-issuer

config:
  appHost: "0.0.0.0"
  appPort: "8000"
  debug: "false"
  environment: "default"
  jwtAlgorithm: "HS256"
  jwtExpirationMinutes: "1440"

database:
  host: "postgresql"
  port: "5432"
  name: "auth"
  user: "cluster_user"
  secretName: "cluster-secret"

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "250m"

probes:
  liveness:
    httpGet:
      path: /api/v1/health
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet:
      path: /api/v1/health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 5

middleware:
  enabled: true
